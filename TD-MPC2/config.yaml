defaults:
    - override hydra/launcher: submitit_slurm

#Slurm 
hydra:
  run:
    dir: ${hydra.runtime.cwd}/logs/hydra/run/${task}/${exp_name}/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: ${hydra.runtime.cwd}/logs/hydra/multirun/${task}/${exp_name}/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    submitit_folder: ${hydra.sweep.dir}/.submitit/%j
    timeout_min: 10
    mem_gb: 64
    additional_parameters:
      gpus: h200:1
      mail-user: isuds@byu.edu
      mail-type: BEGIN,END,FAIL


# environment
task: mujoco-walker
obs: state
episodic: false

# evaluation
checkpoint: ???
eval_episodes: 10
eval_freq: 50000

# training
steps: 10_000_000
batch_size: 256
reward_coef: 0.1
value_coef: 0.1
termination_coef: 1
consistency_coef: 20
rho: 0.5
lr: 3e-4
enc_lr_scale: 0.3
grad_clip_norm: 20
tau: 0.01
discount_denom: 5
discount_min: 0.95
discount_max: 0.995
buffer_size: 1_000_000
exp_name: default
data_dir: ???

# planning
mpc: true
iterations: 6
num_samples: 512
num_elites: 64
num_pi_trajs: 24
horizon: 3
min_std: 0.05
max_std: 2
temperature: 0.5

# actor
log_std_min: -10
log_std_max: 2
entropy_coef: 1e-4

# critic
num_bins: 101
vmin: -10
vmax: +10

# architecture
model_size: 1
num_enc_layers: 2
enc_dim: 256
num_channels: 32
mlp_dim: 512
latent_dim: 512
task_dim: 96
num_q: 5
dropout: 0.01
simnorm_dim: 8

# logging
wandb_project: TD-MPC2
wandb_entity: i-suds
wandb_silent: false
enable_wandb: true
save_csv: true
optimize_metric: auto
optimize_direction: maximize
optuna:
  study_name: ${task}_${exp_name}
  storage: null
  n_trials: 24
  n_jobs: 8
  max_worker_trials: 0
  poll_interval_sec: 30
  wait_for_completion: false
  sampler:
    type: tpe
    seed: ${seed}
  pruner:
    type: median
    n_startup_trials: 8
    n_warmup_steps: 1
    interval_steps: 1
  search_space:
    lr:
      type: float
      low: 1e-5
      high: 1e-3
      log: true
    batch_size:
      type: categorical
      choices: [128, 256, 512]
    horizon:
      type: categorical
      choices: [2, 3, 5, 7]
    num_samples:
      type: categorical
      choices: [256, 512, 1024]
    num_elites:
      type: categorical
      choices: [32, 64, 128]
    tau:
      type: float
      low: 0.001
      high: 0.05
      log: true

# misc
compile: true
save_video: true
save_agent: true
seed: 1

# convenience
work_dir: ???
task_title: ???
multitask: ???
tasks: ???
obs_shape: ???
action_dim: ???
episode_length: ???
obs_shapes: ???
action_dims: ???
episode_lengths: ???
seed_steps: ???
bin_size: ???
optuna_study_name: null
optuna_trial_number: null
optuna_trial_params: null
optuna_trial_state: null
